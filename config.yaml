# MapleStory Worlds 自動化系統配置文件

# 模型設定
model:
  default_path: "weights/best.pt"
  confidence_threshold: 0.10  # 臨時降低以驗證偵測鏈路 (正式使用需重訓模型)
  iou_threshold: 0.45
  device: "auto"  # auto, cpu, cuda

# 視窗設定
window:
  default:
    left: 19
    top: 23
    width: 1728  # 對準「冒险岛怀旧服」視窗
    height: 1009
  # 預設遊戲視窗位置（可根據不同解析度調整）
  presets:
    small:
      left: 100
      top: 100
      width: 640
      height: 480
    medium:
      left: 100
      top: 100
      width: 800
      height: 600
    large:
      left: 100
      top: 100
      width: 1200
      height: 800
    fullhd:
      left: 0
      top: 100
      width: 1920
      height: 980
    qhd:
      left: 320
      top: 180
      width: 1280
      height: 720

# 按鍵設定 (根據您的遊戲配置更新)
controls:
  pickup_key: "z"           # 撿取物品按鍵 (踩在物品上按 Z)
  interact_key: "space"     # 與 NPC 互動按鍵
  attack_key: "a"           # 攻擊按鍵
  attack_method: "key"      # 攻擊方式：使用 Z 鍵攻擊
  
  # 移動按鍵
  movement_keys:
    left: "left"           # 向左移動
    right: "right"         # 向右移動
    jump: "space"          # 跳躍 (空白鍵)
    up: "up"               # 向上 (爬繩/梯子)
    down: "down"           # 向下 (跳下平台)
  
  # 技能和動作按鍵
  skill_keys:
    skill_1: "ctrl"        # 技能1
    skill_2: "1"           # 技能2  
    skill_3: "2"           # 技能3
    skill_4: "3"           # 技能4
    potion: "delete"       # 藥水
    
  # 系統按鍵
  system_keys:
    inventory: "i"         # 背包
    status: "s"           # 狀態視窗
    chat: "enter"         # 聊天

# 自動化行為設定
automation:
  action_delay: 0.3  # 動作間隔秒數
  scan_interval: 0.1  # 掃描間隔
  max_detection_distance: 200  # 最大偵測距離
  priority_targets: ["mob"]  # 只攻擊怪物
  
  # 尋找怪物設定
  mob_hunting:
    enable: true  # 啟用主動尋找怪物
    search_pattern: "horizontal"  # 搜尋模式: horizontal, vertical, random
    move_distance: 100  # 每次移動距離 (像素)
    search_delay: 2.0  # 搜尋間隔 (秒)
    max_search_time: 10  # 最大搜尋時間 (秒)
    return_to_center: true  # 搜尋後是否返回中心
  
# 安全設定
safety:
  enable_failsafe: true
  emergency_stop_corner: true
  max_runtime_hours: 2  # 最大連續運行時間
  screenshot_log: false  # 是否保存截圖日誌

# 監控設定
monitoring:
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_interval: 30  # 監控數據保存間隔（秒）
  max_log_size_mb: 100
  enable_performance_monitor: true

# 偵測行為設定
detection_behavior:
  character:
    action: "ignore"
    log: true
  environment:
    action: "ignore"
    log: false
  item:
    action: "pickup"      # 沒怪時走過去按 Z 撿取
    log: true
    max_distance: 150
    pickup_range_px: 60   # 角色與物品水平距離小於此值才按撿取鍵, 否則走過去接近
    same_layer_px: 80     # 垂直距離超過此值視為異層, 撿不到, 跳過
    approach: true        # 是否走向物品 (超出撿取範圍時朝其方向移動)
    pickup_delay: 0.4     # 撿取後等待秒數
  mob:
    action: "attack"     # 只保留攻擊怪物
    log: true
    max_distance: 150    # (舊參數, 目前改用 attack_range_px 判定)
    attack_range_px: 150 # 角色與怪物水平距離小於此值才攻擊, 否則追擊接近
    same_layer_px: 80    # 角色與怪物垂直距離小於此值才視為同層, 否則跳過 (避免跨層空砍)
    chase: true          # 是否追擊: 怪物超出攻擊範圍時朝其方向移動
    chase_step_sec: 0.25 # 每次追擊按住方向鍵的秒數
    attack_delay: 0.5
  npc:
    action: "ignore"     # 只偵測不執行動作
    log: true
    interaction_delay: 1.0
  ui:
    action: "ignore"
    log: false 